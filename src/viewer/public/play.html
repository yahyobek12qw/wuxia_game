<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WUXIA — Safar</title>
<style>
  :root { --ink: #1d2523; --paper: #f2efe3; --panel: rgba(18, 24, 24, .88); --edge: #4d5b57; --gold: #e3b341; --red: #c4453f; --blue: #3f87c9; --green: #4aa07c; --dim: #a9b4af; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #101615; color: #e8efe9; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn { background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 7px 12px; backdrop-filter: blur(4px); }
  .btn:hover { border-color: #8fa39c; background: rgba(32, 42, 41, .95); }
  .btn kbd { display: inline-block; min-width: 20px; text-align: center; padding: 0 5px; margin-right: 6px; border-radius: 4px; background: #e8efe9; color: #1d2523; font-weight: 700; font-size: 12px; }
  .btn.dis { opacity: .45; }

  #tl { position: fixed; top: 12px; left: 12px; display: flex; gap: 8px; align-items: center; }
  #tr { position: fixed; top: 12px; right: 12px; display: flex; gap: 8px; align-items: center; }
  #near { position: fixed; top: 58px; right: 12px; width: 280px; display: none; flex-direction: column; gap: 6px; max-height: calc(100% - 250px); overflow-y: auto; }
  #near .head { background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 6px 10px; cursor: pointer; display: flex; justify-content: space-between; color: var(--dim); font-size: 12px; }
  #near .head:hover { color: #fff; }
  #near.min { width: auto; }
  .npc { background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 8px 10px; }
  .npc.hostile { border-color: #8f3b37; }
  .npc .nm { font-weight: 600; display: flex; align-items: center; gap: 7px; }
  .npc .sub { color: var(--dim); font-size: 12px; margin: 1px 0 5px; }
  .npc .acts { display: flex; gap: 5px; }
  .npc .acts button { flex: 1; padding: 3px 6px; font-size: 12px; background: #26302f; border: 1px solid var(--edge); border-radius: 6px; }
  .npc .acts button:hover { background: #33403e; }
  .npc .acts button.war { border-color: #8f3b37; color: #ffb4ae; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid #0007; }

  #hud { position: fixed; left: 0; right: 0; bottom: 0; height: 120px; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  #char { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 10px; align-items: flex-end; }
  #portrait { width: 84px; height: 84px; border-radius: 50%; border: 3px solid #c9d2cd; background: radial-gradient(circle at 50% 35%, #f6f2e4, #cfd8d1); box-shadow: 0 3px 12px #000a; }
  #charinfo { background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 7px 11px; min-width: 190px; }
  #charinfo .realm { color: var(--gold); font-weight: 700; }
  #charinfo .row { display: flex; gap: 12px; margin-top: 2px; color: var(--dim); }
  #charinfo .row b { color: #fff; font-weight: 600; }
  .xp { height: 5px; background: #2a3432; border-radius: 3px; margin-top: 5px; overflow: hidden; } .xp i { display: block; height: 100%; background: linear-gradient(90deg, #7fd0b3, #e3b341); }

  #center { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); width: min(560px, calc(100% - 640px)); min-width: 380px; }
  #log { margin-bottom: 8px; text-align: center; text-shadow: 0 1px 3px #000, 0 0 6px #000; }
  #log div { padding: 1px 0; transition: opacity .6s; } #log .good { color: #8ee0b0; } #log .bad { color: #ff948e; } #log .alert { color: #ffd479; } #log .info { color: #e8efe9; }
  #bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .bar { position: relative; height: 20px; background: #0b100f; border: 1px solid #5d6c67; border-radius: 3px; overflow: hidden; }
  .bar i { position: absolute; inset: 0 auto 0 0; }
  .bar span { position: absolute; inset: 0; text-align: center; font-size: 12px; line-height: 18px; text-shadow: 0 1px 2px #000; font-weight: 600; }
  .bar.v i { background: linear-gradient(#e0554f, #8d2823); } .bar.e i { background: linear-gradient(#4aa0e6, #25598f); } .bar.f i { background: linear-gradient(#6fcf8f, #2f7b4b); }
  #hot { display: flex; gap: 6px; margin-top: 8px; justify-content: center; flex-wrap: wrap; }
  #hot .btn { padding: 5px 10px; }

  #right { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 10px; align-items: flex-end; }
  #tileinfo { background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 8px 12px; min-width: 160px; }
  #tileinfo h4 { margin: 0 0 4px; } #tileinfo .kv { display: flex; justify-content: space-between; gap: 14px; color: var(--dim); } #tileinfo .kv b { color: #fff; }
  #mini { width: 140px; height: 140px; border-radius: 50%; border: 3px solid #c9d2cd; background: #7c8480; box-shadow: 0 3px 12px #000a; cursor: pointer; }
  #zoom { position: fixed; left: 12px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; }

  #modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); display: none; place-items: center; z-index: 30; }
  #modal .box { width: min(640px, 92vw); max-height: 80vh; overflow-y: auto; background: #1b2423; border: 1px solid var(--edge); border-radius: 14px; padding: 16px 20px; }
  #modal h3 { margin: 0 0 10px; display: flex; align-items: center; } #modal h3 button { margin-left: auto; }
  .item { padding: 7px 10px; margin-bottom: 6px; border-left: 3px solid var(--edge); background: rgba(255, 255, 255, .04); border-radius: 0 6px 6px 0; }
  .item small { color: var(--dim); display: block; } .item.open { border-left-color: var(--gold); }
  #toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); background: rgba(10, 14, 14, .92); border: 1px solid #8f3b37; color: #ffd0cc; padding: 6px 14px; border-radius: 8px; display: none; z-index: 20; }
  #over { position: fixed; inset: 0; background: rgba(40, 0, 0, .65); display: none; place-items: center; z-index: 40; text-align: center; }
  #over h1 { font-size: 40px; margin: 0 0 8px; } #over .btn { font-size: 16px; padding: 10px 22px; }
  #tip { position: fixed; pointer-events: none; background: rgba(10, 14, 14, .92); border: 1px solid var(--edge); border-radius: 6px; padding: 4px 8px; font-size: 12px; display: none; z-index: 5; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #101615; z-index: 50; color: var(--dim); font-size: 16px; }
  @media (max-width: 900px) { #center { width: calc(100% - 24px); min-width: 0; bottom: 112px; } #char { bottom: 12px; } #right { display: none; } #near { width: 230px; } #hot .btn { padding: 4px 8px; } }
</style>
</head>
<body>
<div id="loading">Dunyo yuklanmoqda…</div>
<canvas id="view"></canvas>

<div id="tl">
  <button class="btn" id="b-intel"><kbd>L</kbd>Razvedka</button>
  <button class="btn" id="b-hall" style="display:none;border-color:#e3b341"><kbd>G</kbd>🏯 Zal</button>
  <button class="btn" id="b-place" style="display:none;border-color:#8fe0ff"><kbd>E</kbd>🏮 Kirish</button>
  <button class="btn" id="b-skills"><kbd>K</kbd>Ko'nikmalar <span id="sp-badge" style="display:none;background:#e3b341;color:#1d2523;border-radius:9px;padding:0 6px;margin-left:4px;font-weight:700"></span></button>
  <button class="btn" id="b-save" title="O'yinni saqlash (avtomatik ham saqlanadi)">💾</button>
  <button class="btn" id="b-new" title="Yangi o'yin">↻</button>
  <a class="btn" href="/" style="text-decoration:none;color:inherit" title="Kuzatuvchi rejimi (sim yadrosi)">👁</a>
  <button class="btn" id="b-map"><kbd>M</kbd>Xarita</button>
  <button class="btn" id="b-sound" title="Tovush (O)">🔊</button>
</div>
<div id="tr"><button class="btn" id="b-letters"><kbd>R</kbd>Vazifalar va maktublar</button></div>
<div id="near"></div>
<div id="zoom">
  <button class="btn" id="z-out">Kengaytirilgan ko'rinish</button>
  <button class="btn" id="z-in">Yaqinroq ko'rinish</button>
</div>

<div id="hud">
  <div id="char">
    <canvas id="portrait" width="168" height="168"></canvas>
    <div id="charinfo">
      <div class="realm" id="c-realm">—</div>
      <div id="c-fac" style="color:#9ad0ff;font-size:12px">—</div>
      <div id="c-date" style="color:var(--dim)">—</div>
      <div class="row"><span>🪙 <b id="c-silver">0</b></span><span>🌿 <b id="c-herb">0</b></span><span>⛏ <b id="c-ore">0</b></span></div>
      <div class="xp"><i id="c-xp" style="width:0"></i></div>
    </div>
  </div>
  <div id="center">
    <div id="log"></div>
    <div id="bars">
      <div class="bar v"><i id="bv"></i><span id="tv"></span></div>
      <div class="bar e"><i id="be"></i><span id="te"></span></div>
      <div class="bar f"><i id="bf"></i><span id="tf"></span></div>
    </div>
    <div id="hot">
      <button class="btn" data-a="explore"><kbd>Z</kbd>Tadqiq</button>
      <button class="btn" data-a="cultivate"><kbd>C</kbd>Mashq (4s)</button>
      <button class="btn" data-a="rest"><kbd>T</kbd>Dam olish (4s)</button>
      <button class="btn" data-a="herb"><kbd>H</kbd>O't ishlatish</button>
      <button class="btn" data-a="inv"><kbd>I</kbd>Inventar</button>
    </div>
  </div>
  <div id="right">
    <div id="tileinfo"></div>
    <canvas id="mini" width="280" height="280"></canvas>
  </div>
</div>

<div id="modal"><div class="box"><h3><span id="m-title"></span><button class="btn" onclick="closeModal()">✕</button></h3><div id="m-body"></div></div></div>
<div id="toast"></div>
<div id="tip"></div>
<div id="over"><div><h1>Safaring tugadi</h1><p id="over-msg" style="margin:0 0 18px;color:#ddd"></p><button class="btn" onclick="newGame()">Yangi o'yin</button></div></div>

<script src="/sound.js"></script>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function rngF(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const T = { PLAIN: 0, FOREST: 1, MOUNTAIN: 2, WATER: 3, ROAD: 4, PLACE: 5 };
const HOURS = [2, 3, 5, 99, 1, 1];
const MINI_COL = ['#bcc79a', '#4f8077', '#8b979d', '#7fb0c6', '#cdb98e', '#d6a43a'];

let MAP = null, S = null, G = null;          // xarita, holat, to'r
let TS = 78;                                  // katak o'lchami (px)
const cam = { x: 0, y: 0 };
let W = 0, H = 0, DPR = 1;
const canvas = $('#view'), ctx = canvas.getContext('2d');
const npcAnim = new Map();                    // id -> {x,y}
let hoverTile = null, path = [], walkId = 0, busy = false;
const seenLog = new Set();

// ====================== Siyoh uslubidagi spritelar ======================
const SPR = 96, OV = Math.round(SPR * 0.62);
const sprites = {};      // sprites[type][variant] = {c, d}
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function curve(c, x0, y0, cx, cy, x1, y1, col, w, a = 1) { c.globalAlpha = a; c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.beginPath(); c.moveTo(x0, y0); c.quadraticCurveTo(cx, cy, x1, y1); c.stroke(); c.globalAlpha = 1; }
function blob(c, x, y, r, col, a) { c.globalAlpha = a; c.fillStyle = col; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); c.globalAlpha = 1; }

function bamboo(c, x, y, h, r) {
  const bend = (r() - 0.5) * 12;
  curve(c, x, y, x + bend * 0.2, y - h * 0.5, x + bend, y - h, '#3b6e66', 2.6);
  for (let k = 1; k <= 4; k++) { const t = k / 5, px = x + bend * t * t, py = y - h * t; curve(c, px - 3, py, px, py - 1.5, px + 3, py, '#24433d', 1.3); }
  for (let k = 0; k < 7; k++) {
    const t = 0.45 + r() * 0.55, px = x + bend * t * t, py = y - h * t, dir = r() < 0.5 ? -1 : 1, len = 11 + r() * 9;
    curve(c, px, py, px + dir * len * 0.5, py - 6 - r() * 4, px + dir * len, py + 3 + r() * 5, r() < 0.5 ? '#4f9488' : '#79b6a8', 2.4, 0.9);
  }
}
function tree(c, x, y, s, r) {
  curve(c, x, y, x - 1, y - s * 0.3, x + 1, y - s * 0.62, '#3a3731', 3.4);
  for (let k = 0; k < 6; k++) blob(c, x + (r() - 0.5) * s * 0.95, y - s * 0.7 - r() * s * 0.45, s * (0.26 + r() * 0.18), '#3f7269', 0.8);
  for (let k = 0; k < 4; k++) blob(c, x - s * 0.15 + (r() - 0.5) * s * 0.5, y - s * 0.95 - r() * s * 0.3, s * (0.12 + r() * 0.1), '#8bc3b5', 0.7);
  for (let k = 0; k < 5; k++) { const a = 3.3 + r() * 2.6, px = x + Math.cos(a) * s * 0.42, py = y - s * 0.85 + Math.sin(a) * s * 0.4; curve(c, px - 4, py, px, py - 3, px + 5, py + 1, '#1f3a35', 1.3, 0.9); }
}
function willow(c, x, y, s, r) {
  curve(c, x, y, x + 2, y - s * 0.3, x - 1, y - s * 0.7, '#4a4033', 3.2);
  for (let k = 0; k < 4; k++) blob(c, x + (r() - 0.5) * s * 0.7, y - s * 0.78 - r() * s * 0.2, s * 0.24, '#6aa58a', 0.75);
  for (let k = 0; k < 16; k++) { const x0 = x + (r() - 0.5) * s * 1.1, y0 = y - s * 0.78 + (r() - 0.5) * 6; curve(c, x0, y0, x0 + (r() - 0.5) * 6, y0 + s * 0.35, x0 + (r() - 0.5) * 10, y0 + s * (0.5 + r() * 0.35), r() < 0.5 ? '#a8d3b0' : '#7fb596', 1.5, 0.85); }
}
function mountain(c, x, y, s, r, snow) {
  const g = c.createLinearGradient(0, y - s * 1.2, 0, y); g.addColorStop(0, '#b4c0c6'); g.addColorStop(1, '#6f7e86');
  c.beginPath(); c.moveTo(x - s * 0.95, y); c.lineTo(x - s * 0.4, y - s * (0.75 + r() * 0.2)); c.lineTo(x - s * 0.12, y - s * 0.5); c.lineTo(x + s * 0.28, y - s * (1.0 + r() * 0.25)); c.lineTo(x + s * 0.55, y - s * 0.6); c.lineTo(x + s, y); c.closePath();
  c.fillStyle = g; c.fill(); c.strokeStyle = '#33434b'; c.lineWidth = 1.8; c.lineJoin = 'round'; c.stroke();
  for (let k = 0; k < 10; k++) { const t = r(), px = x - s * 0.2 + t * s * 0.9, py = y - s * (0.2 + r() * 0.7); curve(c, px, py, px + 3, py + 5, px + 2, py + 11, '#3d4e56', 1.3, 0.5); }
  if (snow) { c.beginPath(); c.moveTo(x + s * 0.28, y - s * 1.05); c.lineTo(x + s * 0.1, y - s * 0.72); c.lineTo(x + s * 0.22, y - s * 0.78); c.lineTo(x + s * 0.32, y - s * 0.66); c.lineTo(x + s * 0.46, y - s * 0.78); c.closePath(); c.fillStyle = '#f4f7f9'; c.fill(); }
  blob(c, x, y - 1, s * 0.8, '#ffffff', 0.18);
}
function grass(c, r, n) {
  for (let k = 0; k < n; k++) {
    const x = 6 + r() * (SPR - 12), y = 10 + r() * (SPR - 14);
    for (let b = -1; b <= 1; b++) curve(c, x + b * 2, y, x + b * 3, y - 5, x + b * 5, y - 8 - r() * 4, r() < 0.5 ? '#6d8f6a' : '#8fae7a', 1.4, 0.9);
  }
  for (let k = 0; k < 6; k++) blob(c, 5 + r() * (SPR - 10), 5 + r() * (SPR - 10), 0.8 + r() * 1.2, '#a8a47e', 0.7);
}
function build() {
  const kinds = [T.PLAIN, T.FOREST, T.MOUNTAIN, T.WATER];
  for (const t of kinds) {
    sprites[t] = [];
    for (let v = 0; v < 8; v++) {
      const col = mk(SPR, SPR + OV), c = col.getContext('2d'), r = rngF(t * 977 + v * 131 + 7);
      c.translate(0, OV);
      if (t === T.PLAIN) { grass(c, r, 4 + Math.floor(r() * 4)); if (v % 4 === 0) blob(c, 20 + r() * 50, 60 + r() * 20, 3 + r() * 2, '#8b8f86', 0.8); }
      else if (t === T.FOREST) {
        const n = 3 + Math.floor(r() * 3), items = [];
        for (let k = 0; k < n; k++) items.push({ x: 12 + r() * (SPR - 24), y: 34 + r() * (SPR - 40), kind: r() });
        items.sort((a, b) => a.y - b.y);
        for (const it of items) { if (it.kind < 0.5) { bamboo(c, it.x, it.y, 46 + r() * 22, r); bamboo(c, it.x + 6, it.y + 3, 38 + r() * 16, r); } else if (it.kind < 0.8) tree(c, it.x, it.y, 44 + r() * 14, r); else willow(c, it.x, it.y, 48 + r() * 12, r); }
      } else if (t === T.MOUNTAIN) {
        mountain(c, 28 + r() * 8, SPR - 8, 36 + r() * 8, r, v % 3 === 0); mountain(c, 66 + r() * 8, SPR - 4, 30 + r() * 8, r, v % 2 === 0);
        for (let k = 0; k < 2; k++) tree(c, 12 + r() * 70, SPR - 2 - r() * 6, 16 + r() * 6, r);
      } else {
        for (let k = 0; k < 4; k++) { const y = 14 + k * 20 + r() * 8, x = 8 + r() * 40; curve(c, x, y, x + 12, y - 4, x + 26, y, '#6f9fb6', 1.6, 0.8); curve(c, x + 28, y + 3, x + 40, y - 1, x + 50, y + 3, '#9bc3d4', 1.3, 0.7); }
      }
      const d = mk(SPR, SPR + OV), dc = d.getContext('2d'); dc.drawImage(col, 0, 0);
      dc.globalCompositeOperation = 'source-atop'; dc.fillStyle = 'rgba(74,84,82,.66)'; dc.fillRect(0, 0, SPR, SPR + OV);
      sprites[t].push({ c: col, d });
    }
  }
}

// ---- Manzil binolari (rangli, 3x3 katak) ----
function ell(x, y, rx, ry, fill, stroke) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); } }
function poly(pts, fill, stroke, lw = 2) { ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); } }
function rect(x, y, w, h, fill, stroke) { poly([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], fill, stroke, 1.5); }
function roof(cx, y, w, h, fill = '#9a3b2e') { poly([[cx - w / 2 - 8, y + 3], [cx - w / 2 + 6, y - h], [cx + w / 2 - 6, y - h], [cx + w / 2 + 8, y + 3], [cx, y - 2]], fill, '#4d1b15', 2); }
function drawSect() {
  ell(0, 30, 130, 42, '#6f6759'); ell(0, 24, 112, 34, '#b5ad9b'); ell(0, 22, 90, 26, '#cfc7b4');
  for (let k = -1; k <= 1; k += 2) { rect(k * 78 - 20, -4, 40, 22, '#e6d9bb', '#6a5a42'); roof(k * 78, -4, 40, 16, '#8c3a2f'); }
  let yy = 18; for (let i = 0; i < 4; i++) { const w = 74 - i * 14, h = 20; rect(-w / 2 + 6, yy - h, w - 12, h, '#efe3c6', '#6a5a42'); rect(-4, yy - h + 4, 8, h - 4, '#6b3a24'); roof(0, yy - h, w + 6, 13, i % 2 ? '#a8432f' : '#8c3a2f'); yy -= h + 8; }
  ctx.strokeStyle = '#d6a43a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, yy + 6); ctx.lineTo(0, yy - 22); ctx.stroke(); ell(0, yy - 24, 4, 4, '#e3b341');
}
function drawVillage(t) {
  for (let i = 0; i < 6; i++) { const a = i * 1.1 + 0.5, fx = Math.cos(a) * 82, fy = Math.sin(a) * 46 + 14; poly([[fx - 30, fy - 6], [fx + 10, fy - 14], [fx + 34, fy + 4], [fx - 6, fy + 12]], i % 2 ? '#c7b457' : '#7e9f43', '#00000030', 1); }

      const lx = w2sx(p.tx + 0.5), ly = w2sy(p.ty) - TS * 0.35; ctx.strokeText(p.name + tag, lx, ly); ctx.fillStyle = p.evil ? '#ff8a80' : p.guardian && !done ? '#ffb4ae' : p.kind === 'sect' ? '#9ad0ff' : '#fbf3da'; ctx.fillText(p.name + tag, lx, ly);

    const R = W - ($('#near').style.display === 'flex' ? 320 : 40), off = x < 40 || x > R || y < 80 || y > H - 150;
    if (off) {
      const cx = W / 2, cy = H / 2, a = Math.atan2(y - cy, x - cx); x = clamp(x, 40, R); y = clamp(y, 80, H - 150); ctx.save(); ctx.translate(x, y); ctx.scale(1.4, 1.4); ctx.translate(-x, -y);
      ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.fillStyle = '#e3b341'; ctx.strokeStyle = '#1d2523'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-8, -10); ctx.lineTo(-8, 10); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); ctx.restore();
    } else {
      ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI / 4); ctx.fillStyle = '#e3b341'; ctx.strokeStyle = '#1d2523'; ctx.lineWidth = 2; ctx.fillRect(-9, -9, 18, 18); ctx.strokeRect(-9, -9, 18, 18); ctx.restore();
      ctx.fillStyle = '#1d2523'; ctx.font = '700 14px "Segoe UI", sans-serif'; ctx.textAlign = 'center'; ctx.fillText('!', x, y + 5);
    }
  }
  // 5) yo'l rejasi
  if (path.length) {
    ctx.strokeStyle = 'rgba(227,179,65,.9)'; ctx.lineWidth = 3; ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.moveTo(w2sx(pl.tx + 0.5), w2sy(pl.ty + 0.5));
    for (const [c, r] of path) ctx.lineTo(w2sx(c + 0.5), w2sy(r + 0.5)); ctx.stroke(); ctx.setLineDash([]);

    const cc = pl.tx + dc, rr = pl.ty + dr; if (!inb(cc, rr) || !EXP[idx(cc, rr)]) continue;
    c.fillStyle = MINI_COL[G.t[idx(cc, rr)]]; c.globalAlpha = fog(cc, rr) === 2 ? 1 : 0.75; c.fillRect((dc + 13) * cs, (dr + 13) * cs, cs + 0.5, cs + 0.5);

function findPath(sc, sr, tc, tr) {

  const push = (f, n) => { hf.push(f); hn.push(n); let i = hf.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (hf[p] <= hf[i]) break; [hf[p], hf[i]] = [hf[i], hf[p]]; [hn[p], hn[i]] = [hn[i], hn[p]]; i = p; } };

  while (hf.length) {

    const cc = cur % bw + x0, cr = ((cur / bw) | 0) + y0;

      if (!dc && !dr) continue; const nc = cc + dc, nr = cr + dr; if (nc < x0 || nc > x1 || nr < y0 || nr > y1) continue;
      const t = G.t[idx(nc, nr)]; if (t === T.WATER) continue;

}
